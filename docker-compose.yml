services:
  # ---- Reverse proxy: Caddy ----
  # The only container that publishes ports. Terminates TLS and forwards
  # to frontend and backend over the internal network.
  proxy:
    image: caddy:2-alpine
    container_name: checkin_proxy
    restart: unless-stopped
    ports:
      - "80:80"     # redirects to 443
      - "443:443"   # the app
    volumes:
      # :ro = read-only. The proxy needs to read these, never write them.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data      # Caddy's own state
    depends_on:
      - frontend
      - backend
    networks:
      - internal

  # ---- Database container: PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: checkin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # healthcheck lets the backend wait until the DB is actually ready,
    # not just "container started". Avoids a classic startup race.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---- Backend container: Fastify ----
  backend:
    build: ./backend
    container_name: checkin_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: "Check-in <no-reply@checkin.local>"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    # source mounted for hot-reload in dev; node_modules kept inside container
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - internal

  # ---- Frontend container: Vite dev server ----
  frontend:
    build: ./frontend
    container_name: checkin_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - internal
  # ---- Dev mail catcher: Mailhog ----
  # Fake SMTP server for development. The backend sends confirmation emails
  # here instead of to real inboxes. View them at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: checkin_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI (SMTP is on 1025, internal only)
    networks:
      - internal

volumes:
  db_data:
  caddy_data:
  uploads_data:

networks:
  internal:
    driver: bridge
